<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Model Portfolio Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06183d; --blue:#0082FB; --blue-d:#0064E0; --blue-l:#4aa3ff; --sky:#8fd3ff;
    --mint:#2AFFCC; --white:#ffffff;
    --card:linear-gradient(150deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
    --stroke:rgba(255,255,255,0.26); --text:#f2f6ff; --muted:#b4c2e6;
    --cheap:#2AFFCC; --medium:#ffc24b; --costly:#ff6b81;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
    font-family:'Outfit',system-ui,-apple-system,sans-serif; font-weight:400; letter-spacing:.1px;}

  /* ---- background: bright-blue blobs + signature glossy light sweep ---- */
  .bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(1100px 760px at 82% -8%, #0a3570 0%, transparent 58%),
      radial-gradient(900px 700px at -5% 108%, #07244f 0%, transparent 55%),
      linear-gradient(160deg,#051636,#071d48 55%,#051636);}
  .blob{position:fixed;z-index:-2;border-radius:50%;filter:blur(95px);opacity:.44;animation:drift 20s ease-in-out infinite;}
  .b1{width:520px;height:520px;top:-120px;left:-70px;background:radial-gradient(circle at 30% 30%,var(--blue),transparent 70%)}
  .b2{width:470px;height:470px;bottom:-150px;right:-60px;background:radial-gradient(circle at 30% 30%,var(--blue-d),transparent 70%);animation-duration:26s;opacity:.38}
  .b3{width:400px;height:400px;top:34%;left:58%;background:radial-gradient(circle at 30% 30%,var(--mint),transparent 70%);animation-duration:32s;opacity:.22}
  .sheen{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
      radial-gradient(760px 620px at 6% 112%, rgba(170,210,255,0.18), transparent 60%),
      linear-gradient(118deg, transparent 42%, rgba(150,200,255,0.08) 58%, rgba(120,180,255,0.05) 72%, transparent 88%);}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(7vw,5vh) scale(1.12)}66%{transform:translate(-5vw,-4vh) scale(.92)}}

  .wrap{max-width:1180px;margin:0 auto;padding:30px 22px 64px}
  header{text-align:center;margin-bottom:8px}
  .title{font-size:42px;font-weight:700;letter-spacing:-.5px;
      background:linear-gradient(92deg,#8fd3ff,#0082FB,#2AFFCC);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      background-size:220% auto;animation:shine 7s linear infinite}
  @keyframes shine{to{background-position:220% center}}
  .subtitle{color:var(--muted);margin-top:6px;font-size:15px;font-weight:300}

  /* ---- node infographic (circular, glossy) ---- */
  .rail{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:28px 0 6px;flex-wrap:nowrap}
  .node{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:0;opacity:.5;transition:.35s}
  .node.active,.node.done{opacity:1} .node.skipped{opacity:.24;filter:grayscale(.7)}
  .disc{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:28px;
      background:var(--card);border:1.5px solid var(--stroke);backdrop-filter:blur(14px);transition:.35s;overflow:hidden}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
      background:linear-gradient(160deg, rgba(255,255,255,0.34), transparent 46%)}
  .node.active .disc{border-color:var(--mint);
      box-shadow:0 0 0 3px rgba(42,255,204,.20),0 0 40px rgba(42,255,204,.5),0 0 60px rgba(0,130,251,.42);
      animation:pulse 1.15s ease-in-out infinite}
  .node.done .disc{border-color:rgba(42,255,204,.55);box-shadow:0 0 22px rgba(42,255,204,.3)}
  @keyframes pulse{50%{box-shadow:0 0 0 3px rgba(42,255,204,.28),0 0 56px rgba(0,130,251,.6),0 0 72px rgba(0,100,224,.45)}}
  .cap{text-align:center;max-width:124px}
  .cap .nm{font-size:13.5px;font-weight:600;color:#fff}
  .cap .sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:300}
  .cap .model{font-size:11px;color:#dcecff;margin-top:4px;font-weight:500}
  .cap .toks{font-size:10px;color:var(--muted);margin-top:2px}
  .tier{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:999px;text-transform:uppercase}
  .tier.cheap{background:rgba(42,255,204,.15);color:var(--cheap);border:1px solid rgba(42,255,204,.45)}
  .tier.medium{background:rgba(255,194,75,.15);color:var(--medium);border:1px solid rgba(255,194,75,.42)}
  .tier.costly{background:rgba(255,107,129,.15);color:var(--costly);border:1px solid rgba(255,107,129,.42)}
  .conn{flex:0 0 26px;height:3px;margin-top:39px;background:rgba(120,160,230,.18);border-radius:3px;position:relative;overflow:hidden}
  .conn.lit::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--mint));animation:flow .9s ease forwards}
  @keyframes flow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
  .loopnote{text-align:center;color:var(--mint);font-size:12.5px;margin-top:2px;height:16px;opacity:0;transition:.3s;font-weight:300}
  .loopnote.show{opacity:1}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:300}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

  /* ---- cost cards (glass, glossy) ---- */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  .cc{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:20px 22px;backdrop-filter:blur(14px);overflow:hidden}
  .cc::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;background:linear-gradient(155deg, rgba(255,255,255,0.22), transparent 42%)}
  .cc .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:500}
  .cc .val{font-size:30px;font-weight:700;margin-top:8px}
  .cc.predicted .val{color:#5bb0ff}
  .cc.actual .val{color:#8fd3ff}
  .cc.savings{background:linear-gradient(150deg, rgba(170,255,233,0.26), rgba(255,255,255,0.07));border-color:rgba(42,255,204,.5)}
  .cc.savings .val{font-size:38px;background:linear-gradient(90deg,#aaffe9,#2AFFCC);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cc .hint{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:14px;font-weight:300}
  .cc .hint b{color:#dcecff;font-weight:600}

  /* ---- chatbox (middle) ---- */
  .chat{display:flex;gap:10px;margin:30px auto 0;max-width:820px}
  .chat input{flex:1;background:linear-gradient(150deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));border:1px solid var(--stroke);border-radius:16px;
      padding:16px 20px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.2s;backdrop-filter:blur(14px)}
  .chat input::placeholder{color:#a7b7da}
  .chat input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,130,251,.18)}
  .chat button{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue-d),var(--blue));border:none;border-radius:16px;
      color:#fff;font-weight:600;font-size:15px;font-family:inherit;padding:0 28px;cursor:pointer;transition:.2s;box-shadow:0 10px 28px rgba(0,130,251,.38)}
  .chat button::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,0.28),transparent 45%)}
  .chat button:hover{transform:translateY(-1px);box-shadow:0 12px 36px rgba(0,130,251,.55)}
  .chat button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px auto 0;max-width:820px}
  .chip{background:rgba(255,255,255,0.10);border:1px solid var(--stroke);color:var(--muted);font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;font-weight:300}
  .chip:hover{color:#fff;border-color:var(--blue)}

  /* ---- output (below) ---- */
  .status{text-align:center;color:var(--muted);font-size:13px;margin-top:20px;min-height:18px;font-weight:300}
  .answer{position:relative;margin-top:14px;background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:22px 24px;
      backdrop-filter:blur(14px);white-space:pre-wrap;line-height:1.6;font-size:14px;color:#e8f1ff;max-height:360px;overflow:auto;overflow-x:hidden}
  .answer::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,0.15),transparent 34%)}
  .answer h4{margin:0 0 10px;color:var(--mint);font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="sheen"></div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
const {useState, useRef, useEffect} = React;

const NODES = [
  {key:"preflight", ico:"🔮", nm:"Estimate",   sub:"preview the cost"},
  {key:"triage",    ico:"🧭", nm:"Understand",  sub:"how hard is it?"},
  {key:"planner",   ico:"🗺️", nm:"Plan",        sub:"break it down"},
  {key:"execution", ico:"✍️", nm:"Answer",      sub:"do the work"},
  {key:"qa",        ico:"🔍", nm:"Review",      sub:"check it's right"},
  {key:"post_run",  ico:"🧾", nm:"Final Bill",  sub:"tally the cost"},
];
const TIER_LABEL = {cheap:"Cheap", medium:"Medium", costly:"Costly"};

function useCountUp(target){
  const [v,setV]=useState(0); const raf=useRef(0);
  useEffect(()=>{
    if(target==null){setV(0);return;}
    const start=performance.now(), dur=900;
    const tick=(t)=>{const p=Math.min(1,(t-start)/dur);
      setV(target*(1-Math.pow(1-p,3)));
      if(p<1) raf.current=requestAnimationFrame(tick);};
    raf.current=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf.current);
  },[target]);
  return v;
}

function CostCard({cls,label,value,hint,prefix="$",suffix="",decimals=5}){
  const anim=useCountUp(value);
  return (
    <div className={"cc "+cls}>
      <div className="lab">{label}</div>
      <div className="val">{value==null?"—":prefix+anim.toFixed(decimals)+suffix}</div>
      <div className="hint">{hint}</div>
    </div>
  );
}

function App(){
  const [prompt,setPrompt]=useState("");
  const [running,setRunning]=useState(false);
  const [nodes,setNodes]=useState({});
  const [predicted,setPredicted]=useState(null);
  const [actual,setActual]=useState(null);
  const [baseline,setBaseline]=useState(null);
  const [savings,setSavings]=useState(null);
  const [estModel,setEstModel]=useState("");
  const [execModel,setExecModel]=useState("");
  const [baseModel,setBaseModel]=useState("GPT-4o");
  const [answer,setAnswer]=useState("");
  const [status,setStatus]=useState("Enter a prompt to run the pipeline.");
  const [loop,setLoop]=useState(false);
  const esRef=useRef(null);

  const reset=()=>{setNodes({});setPredicted(null);setActual(null);setBaseline(null);
    setSavings(null);setEstModel("");setExecModel("");setAnswer("");setLoop(false);};
  const setNode=(key,data)=>setNodes(p=>({...p,[key]:{...(p[key]||{}),...data}}));

  const run=(q)=>{
    const text=(q!=null?q:prompt).trim();
    if(!text||running) return;
    reset(); setRunning(true); setStatus("Starting pipeline…");
    if(esRef.current) esRef.current.close();
    const es=new EventSource("/api/run?prompt="+encodeURIComponent(text));
    esRef.current=es;
    es.onmessage=(ev)=>{
      const d=JSON.parse(ev.data);
      if(d.type==="start"){ setNode("preflight",{status:"active"}); setStatus("Routing your request…"); }
      else if(d.type==="preflight"){
        setPredicted(d.predicted_cost); setBaseline(d.baseline_cost);
        setEstModel(d.est_model||""); if(d.baseline_model) setBaseModel(d.baseline_model);
        setNode("preflight",{status:"done"}); setNode("triage",{status:"active"});
        setStatus("Estimated the cost — now running the request…");
      }
      else if(d.type==="node"){
        setNode(d.node,{status:"done",tier:d.tier,model:d.model,
          tokens:(d.prompt_tokens||0)+(d.completion_tokens||0),cost:d.cost});
        if(d.node==="execution") setExecModel(d.model||"");
        let next=null;
        if(d.node==="triage"){
          if(d.complexity==="Simple"){ setNode("planner",{status:"skipped"}); next="execution"; }
          else next="planner";
        } else if(d.node==="planner") next="execution";
        else if(d.node==="execution") next="qa";
        else if(d.node==="qa"){
          if(d.verdict && d.verdict!=="PASS"){ setLoop(true); next="planner"; }
          else next="post_run";
        }
        if(next) setNode(next,{status:"active"});
        if(d.node==="qa" && d.verdict && d.verdict!=="PASS")
          setStatus("Review failed — replanning with a different model…");
        else setStatus("Working: "+(NODES.find(n=>n.key===d.node)||{}).nm+"…");
      }
      else if(d.type==="done"){
        setNode("post_run",{status:"done"});
        setActual(d.actual_cost); setSavings(d.savings_pct);
        if(d.baseline_cost) setBaseline(d.baseline_cost);
        if(d.baseline_model) setBaseModel(d.baseline_model);
        setAnswer(d.answer||"(no answer text)");
        setStatus("Done — review "+(d.verdict||"")+(d.replans?(" · "+d.replans+" replan(s)"):"")+".");
      }
      else if(d.type==="error"){ setStatus("Error: "+d.message); }
      else if(d.type==="end"){ setRunning(false); es.close(); }
    };
    es.onerror=()=>{ setRunning(false); es.close(); };
  };

  return (
    <div className="wrap">
      <header>
        <div className="title">AI Model Portfolio Manager</div>
        <div className="subtitle">Every request is routed to the cheapest capable model — watch it flow, and see the cost before &amp; after.</div>
      </header>

      <div className="rail">
        {NODES.map((n,i)=>{
          const st=nodes[n.key]||{};
          const prev=i>0?(nodes[NODES[i-1].key]||{}):null;
          const lit=prev && prev.status==="done" && st.status==="done";
          return (
            <React.Fragment key={n.key}>
              {i>0 && <div className={"conn"+(lit?" lit":"")}></div>}
              <div className={"node "+(st.status||"")}>
                <div className="disc">{n.ico}</div>
                <div className="cap">
                  <div className="nm">{n.nm}</div>
                  {st.status==="done" ? (
                    <React.Fragment>
                      {st.tier && <div><span className={"tier "+st.tier}>{TIER_LABEL[st.tier]}</span></div>}
                      {st.model && <div className="model">{st.model}</div>}
                      {st.tokens!=null && <div className="toks">{st.tokens} tok · ${Number(st.cost||0).toFixed(5)}</div>}
                    </React.Fragment>
                  ) : <div className="sub">{st.status==="skipped"?"skipped":(st.status==="active"?"working…":n.sub)}</div>}
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>
      <div className={"loopnote"+(loop?" show":"")}>↩ replan loop — the Review step sent it back to the Plan step</div>
      <div className="legend">
        <span><span className="dot" style={{background:"var(--cheap)"}}></span>Cheap model</span>
        <span><span className="dot" style={{background:"var(--medium)"}}></span>Medium model</span>
        <span><span className="dot" style={{background:"var(--costly)"}}></span>Costly model</span>
      </div>

      <div className="cards">
        <CostCard cls="predicted" label="Predicted cost" value={predicted}
          hint={estModel?(<span>worst-case ceiling · assumes <b>{estModel}</b></span>):"pre-flight worst-case ceiling"}/>
        <CostCard cls="actual" label="Actual cost" value={actual}
          hint={execModel?(<span>answered by <b>{execModel}</b></span>):"measured from real usage"}/>
        <CostCard cls="savings" label="Savings vs monolith" value={savings} prefix="" suffix="%" decimals={1}
          hint={baseline!=null?(<span><b>{baseModel}</b> alone ≈ ${Number(baseline).toFixed(5)}</span>):"vs one big model for everything"}/>
      </div>

      <div className="chat">
        <input value={prompt} placeholder="Ask anything… e.g. “Write a SQL query for the top 5 customers”"
          onChange={e=>setPrompt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") run();}} disabled={running}/>
        <button onClick={()=>run()} disabled={running}>{running?"Running…":"Run ▸"}</button>
      </div>
      <div className="chips">
        {["What is the capital of Japan?",
          "Write a Python function to reverse a linked list.",
          "Compare REST and GraphQL and recommend one, step by step."].map(c=>
          <span className="chip" key={c} onClick={()=>{if(!running){setPrompt(c);run(c);}}}>{c}</span>)}
      </div>

      <div className="status">{status}</div>
      {answer && <div className="answer"><h4>Final answer</h4>{answer}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
