[project]
name = "free-model-portfolio"
version = "0.1.0"
description = "Hackathon LangGraph/LiteLLM model portfolio integration."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "litellm>=1.76.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
